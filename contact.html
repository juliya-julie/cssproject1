<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* MAIN CONTACT SECTION */

        .page4 {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 50px 5%;
            background-color: rgb(3, 44, 44);
        }


        /* CONTACT INFORMATION */

        .contact-info {
            width: 50%;
            min-height: 600px;
            background-color: grey;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-info h2 {
            color: rgb(3, 77, 77);
            text-align: center;
            font-size: 50px;
            font-family: 'Courier New', Courier, monospace;
        }

        .contact-info h3 {
            color: rgb(3, 44, 44);
            margin-bottom: 10px;
        }


        /* CONTACT ITEMS */

        .contact-info-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contact-info-icons {
            flex-shrink: 0;
            background-color: rgb(3, 44, 44);
            height: 35px;
            width: 35px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
        }

        .contact-info-item a {
            color: rgb(3, 44, 44);
            text-decoration: none;
            word-break: break-word;
        }

        .contact-info-item a:hover {
            text-decoration: underline;
        }


        /* SOCIAL MEDIA */

        .sml {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .sml a {
            color: rgb(3, 44, 44);
            font-size: 20px;
        }

        .sml a:hover {
            color: wheat;
        }


        /* MAP */

        .contact-map {
            width: 100%;
            margin-top: 10px;
        }

        .contact-map iframe {
            width: 100%;
            height: 250px;
            border: 0;
        }


        /* CONTACT FORM */

        .contact-form {
            width: 50%;
            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        form {
            width: 100%;
            min-height: 550px;

            padding: 35px;

            background-color: grey;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        form h3 {
            color: rgb(3, 44, 44);
            font-size: 25px;
        }

        label {
            color: rgb(3, 44, 44);
            font-weight: bold;
        }


        /* TWO INPUTS IN ONE ROW */

        .row50 {
            width: 100%;
            display: flex;
            gap: 20px;
        }

        .input-box {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 15px;
        }


        /* MESSAGE */

        .row100 {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            resize: vertical;

            border: none;
            outline: none;

            font-size: 15px;
        }


        /* BUTTON */

        form button {
            height: 40px;
            width: 100px;

            border: none;
            border-radius: 0;

            color: white;
            background-color: rgb(3, 77, 77);

            cursor: pointer;
            font-size: 15px;
        }

        form button:hover {
            color: wheat;
        }
        footer {
    height: auto;

}



        /* TABLET */

        @media (max-width: 900px) {

            .page4 {
                flex-direction: column;
                align-items: center;
                padding: 40px 5%;
            }

            .contact-info,
            .contact-form {
                width: 100%;
            }

            .contact-info {
                min-height: auto;
            }

            .contact-form {
                min-height: auto;
            }

            form {
                min-height: auto;
            }
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .page4 {
                width: 100%;
                padding: 25px 15px;
                gap: 25px;
            }

            .contact-info {
                width: 100%;
                padding: 20px;
                gap: 15px;
            }

            .contact-info h2 {
                font-size: 35px;
            }

            .contact-info h3 {
                font-size: 18px;
                margin: 0;
            }

            .contact-info-item {
                gap: 10px;
            }

            .contact-info-item a {
                font-size: 14px;
            }

            .sml {
                gap: 15px;
            }

            .contact-map iframe {
                height: 220px;
            }


            /* FORM */

            .contact-form {
                width: 100%;
            }

            form {
                width: 100%;
                padding: 20px;
                gap: 18px;
            }

            form h3 {
                font-size: 20px;
            }


            /* FIRST NAME + LAST NAME
               BECOME VERTICAL */

            .row50 {
                flex-direction: column;
                gap: 15px;
            }

            .input-box {
                width: 100%;
            }

            input {
                width: 100%;
                height: 42px;
            }

            textarea {
                width: 100%;
                height: 130px;
            }

            form button {
                width: 100%;
            }
        }


        /* VERY SMALL PHONES */

        @media (max-width: 400px) {

            .page4 {
                padding: 20px 10px;
            }

            .contact-info {
                padding: 15px;
            }

            .contact-info h2 {
                font-size: 30px;
            }

            .contact-info h3 {
                font-size: 16px;
            }

            .contact-info-item a {
                font-size: 13px;
            }

            form {
                padding: 15px;
            }
        }
    </style>
</head>


<body>

    <div class="page4">

        <!-- CONTACT INFORMATION -->

        <div class="contact-info">

            <h2>Contact us</h2>

            <h3>
                Let's start transforming your space -
                contact us today!
            </h3>


            <!-- LOCATION -->

            <div class="contact-info-item">

                <div class="contact-info-icons">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <a href="#">
                    New York, NY 10013
                </a>

            </div>


            <!-- EMAIL -->

            <div class="contact-info-item">

                <div class="contact-info-icons">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <a href="#">
                    interior29@gmail.com
                    <br>
                    designs300@gmail.com
                </a>

            </div>


            <!-- PHONE -->

            <div class="contact-info-item">

                <div class="contact-info-icons">
                    <i class="fa-solid fa-phone"></i>
                </div>

                <a href="#">
                    Dial: +1 (323)-456-91-23
                </a>

            </div>


            <!-- SOCIAL MEDIA -->

            <div class="sml">

                <a href="#" class="icon">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-brands fa-twitter"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-brands fa-linkedin"></i>
                </a>

            </div>


            <!-- MAP -->

            <div class="contact-map">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387050.0808117518!2d-74.6191883109375!3d40.7217861!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259f455555555%3A0x90cdbd83375a4b75!2sECODI!5e0!3m2!1sen!2sin!4v1781195155289!5m2!1sen!2sin"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

        </div>


        <!-- CONTACT FORM -->

        <div class="contact-form">

            <form action="">

                <h3>SEND A MESSAGE</h3>


                <div class="row50">

                    <div class="input-box">

                        <label>First Name</label>

                        <input type="text" placeholder="Enter First Name">

                    </div>


                    <div class="input-box">

                        <label>Last Name</label>

                        <input type="text" placeholder="Enter Last Name">

                    </div>

                </div>


                <div class="row50">

                    <div class="input-box">

                        <label>Email</label>

                        <input type="email" placeholder="email@gmail.com">

                    </div>


                    <div class="input-box">

                        <label>Mobile</label>

                        <input type="tel" placeholder="+91-7448398547">

                    </div>

                </div>


                <div class="row100">

                    <label>Subject Message</label>

                    <textarea placeholder="Write a message here...">
                    </textarea>

                </div>


                <button type="submit">
                    Send
                </button>

            </form>

        </div>

    </div>

</body>

</html>
